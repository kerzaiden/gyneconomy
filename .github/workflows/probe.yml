name: Probe
on:
  push:
    branches: [claude/project-thread-7ddynq]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sSL -m 30 https://data.nber.org/data/abc/abcq.txt; echo
          curl -sSL -m 30 https://data.nber.org/data/abc/abcq.csv | awk -F, 'NR==1 || ($1>=1926 && $1<=1949) {print $1","$2","$3","$4","$5}'
