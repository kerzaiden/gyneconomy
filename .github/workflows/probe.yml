name: Probe
on:
  push:
    branches: [claude/interest-environment-icon-fy95sg]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: |
          curl -sSL -A "gyneconomy-probe" -o b.pdf "https://apps.bea.gov/scb/pdf/2018/01-January/0118-revisions-to-gdp-gdi-and-their-major-components.pdf"
          pdftotext -layout b.pdf b.txt; sed -n '1085,1135p' b.txt | cut -c1-130
          pdftotext -raw b.pdf r.txt; grep -n -A30 "Table 9. Mean Revisions" r.txt | head -45
