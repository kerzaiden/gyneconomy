# The data pipeline. Fetches the figures that move every trading day and COMMITS them, so each
# refresh is a diff you can read, blame or revert — the reason Pages+Actions was chosen over a
# platform that would hide the same data in a key-value store.
#
# Committing to main triggers ci.yml, which tests and then deploys. So a data commit cannot reach
# the site without passing the suite.
name: Data

on:
  schedule:
    # 22:40 UTC on weekdays — after the US close, ten minutes behind the nightly Artifact task so
    # the two never race for the same figures. Cron here is best-effort; a late run is fine,
    # because the script publishes observation DATES and the page shows them.
    - cron: '40 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Until V541 this workflow installed nothing, because the fetcher used only Node's built-in
      # fetch. CAPE needs a spreadsheet reader, so it needs an install — and the first run after
      # V541 failed on exactly that, correctly and loudly. `npm ci` installs optionalDependencies,
      # which is where xlsx lives (see package.json's //xlsx note).
      - name: Install
        run: npm ci

      - name: Fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node tools/fetch-live.js

      # A figure that fails leaves the previous value standing — correct for the DATA, but it also
      # meant a figure failing on EVERY run showed a green tick and said so only deep in a log.
      # The outcome goes on the run's front page now, and each failure raises a warning annotation,
      # so "which figures are actually arriving?" is answerable at a glance instead of by digging.
      - name: Sanity — the file must be valid JSON with at least one document
        run: |
          node -e "
            const fs = require('fs');
            const d = require('./data/live.json');
            const keys = Object.keys(d).filter(k => k !== '_meta');
            if (!keys.length) { console.error('no documents'); process.exit(1); }
            for (const k of keys) if (!d[k].kind) { console.error(k + ' has no kind'); process.exit(1); }
            const failed = d._meta.failed || [];
            const rows = keys.map(k => '| \`' + k + '\` | ok | ' + (d[k].asOf || '') + ' |')
              .concat(failed.map(f => '| \`' + f.split(':')[0] + '\` | **left alone** | ' + f.slice(f.indexOf(':') + 1).trim() + ' |'));
            const md = ['### Data run', '', '| figure | outcome | as of / why |', '|---|---|---|']
              .concat(rows, ['', failed.length ? '**' + failed.length + ' figure(s) did not arrive.** The previous values stand.' : 'Every figure arrived.']);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join('\n') + '\n');
            console.log('ok: ' + keys.length + ' documents — ' + keys.join(', '));
            failed.forEach(f => console.log('::warning title=Figure left alone::' + f));
          "

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # _meta.fetchedAt changes on every run, so compare only the DOCUMENTS. A run that found
          # nothing new must leave no commit behind, or the history fills with noise and stops
          # being the audit trail it exists to be.
          if git diff --quiet -- data/live.json; then
            echo "no change at all"; exit 0
          fi
          changed=$(node -e "
            const { execSync } = require('child_process');
            const now = require('./data/live.json');
            let was = {};
            try { was = JSON.parse(execSync('git show HEAD:data/live.json', {encoding:'utf8'})); } catch (e) {}
            const strip = o => { const c = { ...o }; delete c._meta; return JSON.stringify(c); };
            console.log(strip(now) === strip(was) ? 'no' : 'yes');
          ")
          if [ "$changed" != "yes" ]; then
            echo "only the timestamp moved — not committing"
            git checkout -- data/live.json
            exit 0
          fi
          git add data/live.json
          git commit -m "Data: $(node -p "require('./data/live.json')._meta.ok.join(', ')")

          Fetched by tools/fetch-live.js from its sources. Values that failed their sanity
          band or could not be fetched are left out, and the previous ones stand."

          # PULL BEFORE PUSHING — the same rule CLAUDE.md gives a person, and this workflow was
          # the one writer not following it. The remote moves under a run: a commit pushed from
          # Keren's machine, or the previous data run, lands between this job's checkout and its
          # push, and the push is rejected with "fetch first". That happened on Data #2.
          # Rebasing is safe here because this job only ever touches data/live.json and a run
          # that changed nothing has already exited above.
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected — rebasing onto the remote and retrying"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::could not push after 3 attempts"; exit 1
