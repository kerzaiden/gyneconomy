name: Data

on:
  schedule:
    - cron: '40 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node tools/fetch-live.js

      - name: Sanity — the file must be valid JSON with at least one document
        run: |
          node -e "
            const fs = require('fs');
            const d = require('./data/live.json');
            const keys = Object.keys(d).filter(k => k !== '_meta');
            if (!keys.length) { console.error('no documents'); process.exit(1); }
            for (const k of keys) if (!d[k].kind) { console.error(k + ' has no kind'); process.exit(1); }
            const failed = d._meta.failed || [];
            const rows = keys.map(k => '| \`' + k + '\` | ok | ' + (d[k].asOf || '') + ' |')
              .concat(failed.map(f => '| \`' + f.split(':')[0] + '\` | **left alone** | ' + f.slice(f.indexOf(':') + 1).trim() + ' |'));
            const md = ['### Data run', '', '| figure | outcome | as of / why |', '|---|---|---|']
              .concat(rows, ['', failed.length ? '**' + failed.length + ' figure(s) did not arrive.** The previous values stand.' : 'Every figure arrived.']);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join('\n') + '\n');
            console.log('ok: ' + keys.length + ' documents — ' + keys.join(', '));
            failed.forEach(f => console.log('::warning title=Figure left alone::' + f));
          "

      - name: Commit if anything moved
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/live.json; then
            echo "no change at all"; exit 0
          fi
          changed=$(node -e "
            const { execSync } = require('child_process');
            const now = require('./data/live.json');
            let was = {};
            try { was = JSON.parse(execSync('git show HEAD:data/live.json', {encoding:'utf8'})); } catch (e) {}
            const strip = o => { const c = { ...o }; delete c._meta; return JSON.stringify(c); };
            console.log(strip(now) === strip(was) ? 'no' : 'yes');
          ")
          if [ "$changed" != "yes" ]; then
            echo "only the timestamp moved — not committing"
            git checkout -- data/live.json
            exit 0
          fi
          git add data/live.json
          git commit -m "Data: $(node -p "require('./data/live.json')._meta.ok.join(', ')")

          Fetched by tools/fetch-live.js from its sources. A value that failed its sanity
          band or could not be fetched keeps its previous document, with its own asOf."

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed on attempt $attempt"; echo "pushed=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected — rebasing onto the remote and retrying"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || exit 1
          done
          echo "::error::could not push after 3 attempts"; exit 1

      - name: Deploy the site with the new figures
        if: steps.commit.outputs.pushed == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
