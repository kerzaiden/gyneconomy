name: Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "40 23 3 * *"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:tools

      - name: Fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node tools/fetch-fred-history.js

      - name: Rebuild
        run: npm run build && npm run build:check && npm run map

      - name: Commit
        run: |
          if git diff --quiet; then echo "no change — FRED returned what we already had"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/03b-history-fred.js index.html docs/MAP.md
          git commit -m "Backfill: Fed funds, the fear curve, the OMB fiscal series and the Treasury quarters, from FRED (fetched $(date -u +%F))"
          git push
          {
            echo "### Backfill committed"
            echo ""
            grep -E '^  var ' src/js/03b-history-fred.js | cut -c1-160 || true
          } >> "$GITHUB_STEP_SUMMARY"
