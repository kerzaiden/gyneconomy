name: Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "40 23 3 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:tools

      - name: Fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node tools/fetch-fred-history.js

      - name: Rebuild and check what will be committed
        run: npm run build && npm run map && npm run check

      - name: Commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "no change — FRED returned what we already had"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          msg="Backfill: Fed funds and the Fed's moves, the VIX and VXO, the OMB fiscal series, the Treasury quarters, productivity, OECD consumer confidence, real durable-goods spending, and GDP, CPI and S&P returns before 1990, from FRED, the OECD and Damodaran (fetched $(date -u +%F))"
          files="src/data/fred.json index.html docs/MAP.md docs/COMPONENTS.md"
          git add $files
          git commit -m "$msg"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed on attempt $attempt"; break; fi
            [ "$attempt" = 3 ] && { echo "::error::could not push after 3 attempts"; exit 1; }
            echo "push rejected — rebuilding the new histories on top of the remote and retrying"
            cp src/data/fred.json "$RUNNER_TEMP/fred.json"
            git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/fred.json" src/data/fred.json
            npm run build && npm run map && npm run check || exit 1
            if git diff --quiet; then echo "the remote already has these histories"; exit 0; fi
            git add $files
            git commit -m "$msg"
          done
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
          echo "::warning title=Artifact behind::index.html changed on this branch; a Claude session must republish the artifact from it"
          {
            echo "### Backfill committed"
            echo ""
            node -e 'const f = require("./src/data/fred.json"); for (const k in f) console.log(k + ": " + (Array.isArray(f[k]) ? f[k].length + " rows" : Object.keys(f[k]).length + " keys"))'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the site with the new histories
        if: steps.commit.outputs.pushed == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
