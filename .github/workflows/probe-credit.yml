name: Probe credit
on:
  push:
    branches: [claude/project-thread-vecpqm]
    paths: [probe/credit.js, .github/workflows/probe-credit.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node probe/credit.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/credit.json
          git commit -m "Probe: credit series"
          git push origin HEAD:${GITHUB_REF_NAME}
