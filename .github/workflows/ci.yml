name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: The gate (build, email, comments, load order, hygiene, map, ledger, tool tests)
        run: npm run check

      - name: Browser suite
        run: npm test

      - name: Accessibility
        run: npm run a11y:check

      - name: Sources page
        run: npm run sources:check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html sources.html manifest.webmanifest sw.js _site/
          cp assets/icon-192.png assets/icon-512.png assets/appicon-180.png \
             assets/appicon-square.svg _site/assets/
          cp data/live.json _site/data/
          touch _site/.nojekyll
          echo "--- site ---"; find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
