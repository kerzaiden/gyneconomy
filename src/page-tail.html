<script>
(function () {
  try {
    if (!("serviceWorker" in navigator)) return;
    if (window.top !== window.self) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;
    window.addEventListener("load", function () {
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        if (!reg) return;
        var last = 0;
        var check = function () {
          if (document.visibilityState !== "visible") return;
          var now = Date.now();
          if (now - last < 60000) return;
          last = now;
          reg.update().catch(function () {});
        };
        document.addEventListener("visibilitychange", check);
        window.addEventListener("focus", check);

        var pending = false, reloading = false;
        var drafting = function () {
          return Array.prototype.some.call(document.querySelectorAll("textarea, input[type=text], input:not([type])"),
            function (el) { return el.value.trim() !== ""; });
        };
        var settle = function () {
          if (!pending || reloading || document.visibilityState !== "hidden" || drafting()) return;
          reloading = true;
          location.reload();
        };
        document.addEventListener("visibilitychange", settle);
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hadController) return;
          pending = true;
          settle();
        });

})();
</script>
